project: DiskHNSW
id-prefixes: [CHR, DEF, ARCH, BEH, API, CON, VER, DEC, Q, CONFLICT]
layers: {L0: intent, L1: contract, L2: mechanism, L3: executable}
source: observed
description: |
  DiskHNSW — 内存受限环境下的磁盘向量搜索系统。
  source=observed 表示条款直接源自代码实体，非从设计文档推断。
  OBS-/INTENT- 前缀已废除；历史对照见 archive/2026-07/comparison.md。

# archive/ 不在 NDF 核心树中；本仓库扩展为冷存储（非 SoT）。
# 现行契约仅以 00–50、decisions/、open/（Pending）为准。
archive:
  path: archive/
  role: cold-storage
  sot: false
  note: |
    Implemented 提案、历史 validation/perf、已关闭 CONFLICT 迁入此处。
    Agent MUST NOT 将 archive/ 正文当作现行 must 契约；以 status=superseded
    留在 decisions/ 的条款为准。

