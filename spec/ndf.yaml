project: DiskHNSW
id-prefixes: [CHR, DEF, ARCH, BEH, API, CON, VER, DEC, Q, CONFLICT, ADR, PROP]
layers: {L0: intent, L1: contract, L2: mechanism, L3: executable}
source: observed
description: |
  DiskHNSW — 内存受限环境下的磁盘向量搜索系统。
  source=observed 表示条款直接源自代码实体，非从设计文档推断。
  OBS-/INTENT- 前缀已废除；历史对照见 archive/2026-07/comparison.md.

# archive/ 不在 NDF 核心树中；本仓库扩展为冷存储（非 SoT）。
# 现行产品契约以 00–50、decisions/（产品 DEC）、open/（Pending 产品提案）为准。
# 流程纪律 SoT 见 meta/（ndf-process-profile）。
archive:
  path: archive/
  role: cold-storage
  sot: false
  note: |
    Implemented 提案、历史 validation/perf、已关闭 CONFLICT 迁入此处。
    Agent MUST NOT 将 archive/ 正文当作现行 must 契约；以 status=superseded
    留在 decisions/ 的条款为准。

# NDF process profile：Agent 流程 SoT；非 DiskHNSW 产品行为 must。
meta:
  path: meta/
  role: ndf-process-profile
  sot: true
  product_behavior: false
  note: |
    双轨 / POC 边界 / 装订 / 卫生 ADR。条款 scope=ndf-process。
    process 提案：meta/open/proposal-meta-*.md。见 meta/README.md、ADR-META-001。
    审核工具：meta/tools/（原仓库根 tools/ndf/，已迁入）。

# POC 探索轨：非 SoT。晋升前不得当作 BEH/API/CON must 的实现依据。
poc:
  path: ../poc/
  role: exploration
  sot: false
  note: |
    仓库根 poc/<topic>/；见 ARCH-008 / BEH-018…020 / BEH-025 / CON-POC-001（正文在 meta/）。
    每个 topic MUST 有 poc/<topic>/ndf/ 主题装订器（TOPIC.md + COMMITS.md）；
    装订器非 Trunk must 源。扫描：python3 spec/meta/tools/ndf_index.py poc-topics

# L3 参考模型：金标，禁止存放生产路径实验补丁。
models:
  path: models/
  role: L3-reference
  sot: true
  note: |
    仅 NDF 参考模型；探索见仓库根 poc/。

layout:
  meta:
    README.md: [process-profile]
    process.md: [CHR-008, BEH-018..020, BEH-025]
    architecture.md: [ARCH-008]
    constraints.md: [CON-POC-001]
    glossary.md: [DEF-020..023]
    decisions:
      adr-meta-layer-split.md: [ADR-META-001]
      adr-topic-binder.md: [ADR-TOPIC-BINDER-001]
      adr-ndf-hygiene.md: [DEC-HYGIENE-001]
      adr-poc-track.md: [ADR-POC-001]
    open: "process / hygiene proposals (proposal-meta-*)"
    tools: [README.md, ndf_index.py]
  00-charter: [charter.md, glossary.md]
  10-architecture: [modules.md]
  20-behavior:
    search.md: [BEH-001..006, BEH-008, BEH-021..024(draft)]
    fine-rerank.md: [BEH-007, BEH-011, BEH-014, BEH-017(deprecated)]
    cache.md: [BEH-009, BEH-010]
    prefetch.md: [BEH-012]
    metrics.md: [BEH-013]
    io-modes.md: [BEH-015, BEH-016]
    process.md: [adopted-pointer-to-meta]
  30-interfaces:
    cli.md: [API-001..003]
    formats.md: [API-004]
    cxx-api.md: [API-005..006]
    env.md: [API-007..008, API-009(deprecated), API-010(draft)]
  40-constraints:
    constants.md: [CON-001..007]
    sla.md: [CON-SLA-*, CON-HONEST-002, CON-SLA-013(draft), CON-SLA-014]
  50-verification: [acceptance.md, acceptance-p2.md]
  decisions:
    01-foundation.md: [DEC-001..016]
    02-fine-rerank-experiments.md: [DEC-017..025]
    03-scale-and-io.md: [DEC-026..033]
    04-p2.md: [DEC-034..039]
    05-odirect-floor.md: [DEC-057..061]
    06-strict-cgroup.md: [DEC-065, DEC-066]
    adr-ndf-hygiene.md: [stub-to-meta]
    adr-poc-track.md: [stub-to-meta]
  models: [README.md]
  open: "Pending product proposals / unanswered Q / active CONFLICT only"
  archive: "cold storage; not SoT"
  poc: "repo-root ../poc/; exploration; not SoT"

# Review surface (generated; not normative prose). Tooling outside product scripts/
tooling:
  ndf_index: spec/meta/tools/ndf_index.py
  outputs: [INDEX.md, graph.json]
  note: |
    INDEX/graph are generated for human jump/impact review. SoT remains 00-50 + meta + decisions.
    Implementation is under spec/meta/tools/ (harness), not scripts/ (data pipeline).
    POC binders: `python3 spec/meta/tools/ndf_index.py poc-topics` (non-SoT).
    INDEX groups META (scope=ndf-process / meta/) vs product prefixes.
